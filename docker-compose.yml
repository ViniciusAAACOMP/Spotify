services:
  postgresql:
    container_name: 'spotify_postgres'
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  pgadmin:
    container_name: 'spotify_pgadmin'
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "meuemail@email.com"
      PGADMIN_DEFAULT_PASSWORD: "password"
    ports:
      - "8090:80"
    depends_on:
      - postgresql

volumes:
  postgres_data:
